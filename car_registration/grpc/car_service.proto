syntax = "proto3";

service CarService {
    rpc SyncCarData(SyncRequest) returns (SyncResponse);
}

message SyncRequest {
    string request_id = 1;
}

message Car {
    string make = 1;
    string model = 2;
    int32 year = 3;
}

message SyncResponse {
    string status = 1;
    repeated Car cars = 2;
    int32 total_count = 3;
}
