services:
  web:
    build: .
    command: sh /app/bin/web.sh
    ports:
      - "5000:5000"

  worker:
    build: .
    command: sh /app/bin/celery_worker.sh

  beat:
    build: .
    command: sh /app/bin/celery_beat.sh
    depends_on:
      - worker
    
  redis:
    image: redis:7
    ports:
      - "6379:6379"
